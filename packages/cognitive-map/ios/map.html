<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cognitive Map</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  /* ui-serif resolves to New York in WKWebView, which is what SwiftUI's
     Font.system(design: .serif) already uses, so the map's type matches the app. */
  body { font-family: ui-serif, Georgia, serif; -webkit-user-select: none; user-select: none; }
  #root { width: 100%; height: 100%; }
</style>
<div id="root"></div>
<!-- Xcode flattens Resources/vendor/ into the bundle root at build time (it's a
     PBXGroup, not a folder reference), same as graph.html and soul.html loading
     constellation.min.js from this same vendor/ folder. Keep this path flat. -->
<script src="./cognitive-map.iife.js"></script>
<script>
  var handle = null;

  // Called by the native host with the decrypted map plus the theme values resolved
  // for the current trait collection.
  window.renderCognitiveMap = function (map, theme) {
    // WKWebView redacts window.onerror to "Script error." for anything thrown inside
    // vendor/cognitive-map.iife.js, since it treats a <script src> file:// resource as
    // a different origin from this inline script. A try/catch around the call sees the
    // real Error object regardless, so this is the only way to get a message out.
    try {
      var root = document.getElementById('root');
      if (handle) { handle.destroy(); handle = null; }
      handle = CognitiveMap.mountCognitiveMap(root, map, {
        theme: theme || {},
        onSelectBeat: function (beatId) {
          window.webkit.messageHandlers.selectBeat.postMessage(beatId);
        }
      });
    } catch (e) {
      window.webkit.messageHandlers.log.postMessage(
        'render threw: ' + (e && e.message) + (e && e.stack ? '\n' + e.stack : '')
      );
    }
  };

  window.onerror = function (message, source, line, column) {
    window.webkit.messageHandlers.log.postMessage(
      'JS error: ' + message + ' @' + (source || '') + ':' + line + ':' + column
    );
  };
</script>
